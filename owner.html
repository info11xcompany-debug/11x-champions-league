.langbtn{
  border:1px solid rgba(255,255,255,.26);border-radius:99px;
  padding:5px 11px;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.04em;
}
.langbtn:active{background:rgba(255,255,255,.16)}

/* ==================== CARDS ==================== */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow-s);padding:18px;margin-bottom:14px;
  border:1px solid rgba(225,230,237,.9);
  animation:rise .45s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{
  margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;
}
.card h2::before{
  content:"";width:14px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold-lite));flex:none;
}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}

/* ==================== SCORE GAUGE ==================== */
.scorewrap{display:flex;align-items:center;gap:18px;margin:6px 0 2px}
.gauge{position:relative;width:118px;height:118px;flex:none}
.gauge svg{width:118px;height:118px;transform:rotate(-90deg)}
.gauge .trk{fill:none;stroke:var(--page);stroke-width:11}
.gauge .val{
  fill:none;stroke:url(#goldgrad);stroke-width:11;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s var(--ease);
}
.gauge .mid{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.gauge .num{
  font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.gauge .of{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.scoreside{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.pill{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;
  background:var(--page);color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.pill b{font-weight:800}
.pill.rank{background:var(--gold-tint);color:var(--gold-deep);border:1px solid rgba(200,149,31,.28)}
.pill.bad{background:var(--clay-tint);color:var(--clay)}
.pill.good{background:var(--jade-tint);color:var(--jade)}
.pointsbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ==================== SIGNATURE: MONTH LEDGER ==================== */
.ledger{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;gap:10px}
.ledger-head b{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ledger-head span{font-size:13px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(27px,1fr));gap:5px}
.day{
  position:relative;aspect-ratio:1;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--page);color:#A7B4C4;border:1px solid transparent;
  animation:pop .34s var(--ease) both;
}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.day.filled{
  background:linear-gradient(160deg,var(--ink-2),var(--ink));color:var(--gold-lite);
  border-color:var(--ink);box-shadow:0 2px 5px rgba(10,26,47,.24);
}
.day.late{background:#fff;color:var(--gold-deep);border-color:var(--gold)}
.day.closed{background:repeating-linear-gradient(135deg,#fff,#fff 3px,var(--line) 3px,var(--line) 5px);color:var(--muted);border-color:var(--line)}
.day.missed{background:#fff;border:1.5px dashed var(--clay);color:var(--clay)}
.day.future{opacity:.38}
.day.today{outline:2.5px solid var(--gold);outline-offset:2px;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ==================== TODAY CARD ==================== */
.today-card{
  border:1.5px solid rgba(200,149,31,.45);
  background:linear-gradient(180deg,var(--gold-tint) 0%,#fff 46%);
  box-shadow:var(--shadow-m);
}
.today-card.done{
  border-color:rgba(14,122,87,.4);
  background:linear-gradient(180deg,var(--jade-tint) 0%,#fff 46%);
}
.field{margin-bottom:13px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field .hint{font-weight:400;color:var(--muted);font-size:13px}
.inputbox{position:relative;display:flex;align-items:center}
.inputbox .pre{
  position:absolute;left:14px;font-size:19px;font-weight:700;color:var(--muted);pointer-events:none;
}
.field input{
  width:100%;padding:14px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:#fff;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);transition:border-color .18s,box-shadow .18s;
}
.inputbox.has-pre input{padding-left:34px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,149,31,.15)}
.field input[type=date]{font-size:17px}

.done-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px;
}
.done-row:last-of-type{border-bottom:none}
.done-row span{color:var(--muted)}
.done-row b{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.tick{
  width:44px;height:44px;border-radius:50%;background:var(--jade);color:#fff;
  display:flex;align-items:center;justify-content:center;margin:2px 0 10px;
  font-size:22px;animation:pop .4s var(--ease) both;
}

/* ==================== BUTTONS ==================== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 18px;border-radius:15px;
  background:linear-gradient(135deg,var(--ink-2),var(--ink));
  color:#fff;font-weight:700;font-size:16.5px;text-align:center;letter-spacing:.01em;
  box-shadow:0 8px 20px rgba(10,26,47,.20);
  transition:transform .14s var(--ease), box-shadow .14s var(--ease), opacity .14s;
}
.btn:active{transform:translateY(2px) scale(.995);box-shadow:0 3px 9px rgba(10,26,47,.18)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.gold{
  background:linear-gradient(135deg,var(--gold-lite),var(--gold));
  color:#2A1D00;box-shadow:0 8px 20px rgba(200,149,31,.34);
}
.btn.gold:active{box-shadow:0 3px 9px rgba(200,149,31,.3)}
.btn.ghost{
  background:#fff;color:var(--ink-2);border:1.5px solid var(--line);
  box-shadow:none;font-size:15px;padding:13px 16px;
}
.btn.ghost:active{background:var(--page)}
.btn.danger{
  background:#fff;color:var(--clay);border:1.5px solid rgba(196,60,44,.32);
  box-shadow:none;font-size:15px;padding:13px 16px;
}
.btn.danger:active{background:var(--clay-tint)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin:0}

/* ==================== METRIC PROGRESS ==================== */
.metric{padding:14px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none;padding-bottom:0}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.metric-name{font-weight:600;font-size:15px}
.metric-name em{
  font-style:normal;font-size:11px;color:var(--gold-deep);font-weight:700;margin-left:6px;
  background:var(--gold-tint);padding:2px 6px;border-radius:5px;letter-spacing:.03em;
}
.metric-pct{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--page);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s var(--ease)}
.metric-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

/* ==================== LEADERBOARD ==================== */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-rank{
  width:28px;height:28px;flex:none;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;
  color:var(--muted);background:var(--page);
}
.lb-row.r1 .lb-rank{background:linear-gradient(150deg,var(--gold-lite),var(--gold));color:#2A1D00}
.lb-row.r2 .lb-rank{background:linear-gradient(150deg,#E3E8EE,#BFC9D6);color:var(--ink)}
.lb-row.r3 .lb-rank{background:linear-gradient(150deg,#E6C4A0,#C9986A);color:#3B2409}
.lb-row.me{
  background:var(--gold-tint);margin:0 -18px;padding:12px 18px;border-radius:12px;
  box-shadow:inset 3px 0 0 var(--gold);
}
.lb-name{flex:1;min-width:0}
.lb-name b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pts{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.lb-pts em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}

.champion::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold-lite),var(--gold-deep));
}
.champion h2{
  color:var(--gold-lite);margin:0 0 10px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px;
}
.champion h2::before{content:"";width:16px;height:2px;background:var(--gold);border-radius:2px}
.champion b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em}
.champion .cspan{color:#A9BBD1;font-size:13.5px}
.champion .pts{
  margin-top:12px;font-size:34px;font-weight:800;color:var(--gold-lite);
  font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em;
}
.champion .pts em{font-style:normal;font-size:12px;color:#A9BBD1;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-left:7px}

/* ==================== TABS ==================== */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;gap:6px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(10,26,47,.07);
}
.tabs button{
  flex:1;padding:8px 4px 7px;font-size:12px;font-weight:600;color:var(--muted);
  border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .2s,color .2s;
}
.tabs button svg{width:21px;height:21px;stroke-width:1.9}
.tabs button.on{color:var(--ink);background:var(--page)}
.tabs button.on svg{stroke:var(--gold-deep)}

.login::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(10,26,47,.50) 0%, rgba(10,26,47,.80) 40%, rgba(10,26,47,.97) 100%);

.login-inner{max-width:420px;width:100%;margin:0 auto}
.login .badge{
  width:76px;height:76px;border-radius:22px;background:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.4);
  animation:rise .6s var(--ease) both;
}
.login .badge img{width:60px;height:60px;object-fit:contain}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--gold-lite);margin:0 0 8px;
}
.login h1{
  font-size:32px;font-weight:800;letter-spacing:-.025em;margin:0 0 10px;line-height:1.1;
}
.login h1 .x{color:var(--gold-lite)}
.rule{width:52px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold-lite),var(--gold));margin:0 0 14px}
.login p{color:#B3C3D6;margin:0 0 24px;font-size:15px}
.login .fieldset{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.login input{
  width:100%;padding:14px 15px;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;
  margin-bottom:10px;font-size:16px;background:rgba(255,255,255,.06);color:#fff;
  transition:border-color .18s,background .18s;
}
.login input::placeholder{color:#8FA3BB}
.login input:focus{outline:none;border-color:var(--gold-lite);background:rgba(255,255,255,.12)}
.login .lang-line{text-align:center;margin-top:14px}
.login .lang-line button{color:#B3C3D6;font-size:14px;font-weight:600;padding:8px 14px;border-radius:10px}
.login .lang-line button:active{background:rgba(255,255,255,.1)}

/* ==================== MISC ==================== */
.msg{padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.msg.err{background:var(--clay-tint);color:var(--clay)}
.msg.ok{background:var(--jade-tint);color:var(--jade)}
.msg.warn{background:var(--gold-tint);color:var(--gold-deep)}
.login .msg.err{background:rgba(196,60,44,.2);color:#FFC9C1;border:1px solid rgba(255,150,135,.3)}
.empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:15px}
.empty .big{display:block;font-size:30px;margin-bottom:8px;opacity:.6}

.skel{border-radius:12px;background:linear-gradient(100deg,var(--page) 30%,#F7F9FB 50%,var(--page) 70%);background-size:220% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{to{background-position:-220% 0}}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;
  font-size:14.5px;font-weight:600;box-shadow:0 12px 30px rgba(10,26,47,.34);
  max-width:88vw;text-align:center;transition:opacity .25s,transform .25s var(--ease);
  border:1px solid rgba(239,196,99,.32);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--clay);border-color:rgba(255,255,255,.24)}
.toast.ok{background:var(--jade);border-color:rgba(255,255,255,.24)}

/* modal */
.backdrop{
  position:fixed;inset:0;z-index:70;background:rgba(10,26,47,.58);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
  padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom));
  animation:fade .2s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:#fff;border-radius:22px;padding:22px 20px;width:100%;max-width:440px;
  box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .32s var(--ease) both;
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sheet p{margin:0 0 18px;color:var(--muted);font-size:14.5px}

body[data-lang="ml"] .eyebrow,
body[data-lang="ml"] .card h2,
body[data-lang="ml"] .chip,
body[data-lang="ml"] .champion h2,
body[data-lang="ml"] .gauge .of,
body[data-lang="ml"] .ledger-head b{letter-spacing:.04em;text-transform:none}
body[data-lang="ml"] .login h1{font-size:29px;line-height:1.22}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

/* ========================== state ========================== */
var S = { lang:'ml', token:null, data:null, board:null, tab:'today', busy:false };

function t(key, vars){
  var s = (T[S.lang] && T[S.lang][key]) || T.en[key] || key;
  if (vars) Object.keys(vars).forEach(function(k){ s = s.replace('{'+k+'}', vars[k]); });
  return s;
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ========================== toast + sheet ========================== */
var toastTimer = null;
function toast(text, kind){
  var el = $('toast');
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  el.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = 'toast'; }, 2800);
}
function closeSheet(){ $('modalHost').innerHTML = ''; }
function sheet(title, body, okLabel, onOk, danger){
  window.__sheetOk = onOk;
  $('modalHost').innerHTML =
    '<div class="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">' +
      '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
      '<button class="btn' + (danger ? '' : ' gold') + '" onclick="var f=window.__sheetOk;closeSheet();f&&f()">' + esc(okLabel) + '</button>' +
      '<div class="btn-row"><button class="btn ghost" onclick="closeSheet()">' + esc(t('cancel')) + '</button></div>' +
    '</div></div>';
}

/* ========================== api ========================== */
function api(action, payload){
  var body = Object.assign({ action:action, token:S.token }, payload || {});
  return fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body:JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if (!res.ok) throw new Error(res.error || 'ERROR');
    return res.data;
  });
}

/* ========================== language ========================== */
function toggleLang(){
  S.lang = LANGS[(LANGS.indexOf(S.lang)+1) % LANGS.length];
  document.body.dataset.lang = S.lang;
  document.documentElement.lang = S.lang;
  localStorage.setItem('lang', S.lang);
  paintChrome();
  if (S.token) { if (S.data) render(); if (S.tab==='board') renderBoard(); if (S.tab==='me') renderMe(); }
}
function paintChrome(){
  $('loginSub').textContent = t('tagline');
  $('loginEyebrow').textContent = t('eyebrow');
  $('loginBtn').textContent = t('signin');
  $('username').placeholder = 'Username';
  $('password').placeholder = 'Password';
  $('tabTodayLbl').textContent = t('today');
  $('tabBoardLbl').textContent = t('board');
  $('tabMeLbl').textContent = t('me');
  $('hLang').textContent = S.lang === 'ml' ? 'EN' : 'ML';
}

/* ========================== login ========================== */
function doLogin(){
  var u = $('username').value.trim(), p = $('password').value;
  if (!u || !p) return;
  $('loginBtn').textContent = t('signingin');
  $('loginBtn').disabled = true;
  api('login', { username:u, password:p })
    .then(function(d){
      S.token = d.token;
      localStorage.setItem('token', d.token);
      if (d.user.lang) { S.lang = d.user.lang; document.body.dataset.lang = S.lang; }
      $('loginView').classList.add('hide');
      $('appView').classList.remove('hide');
      paintChrome();
      load();
    })
    .catch(function(e){
      $('loginMsg').innerHTML = '<div class="msg err">' +
        esc(e.message === 'AUTH_FAILED' ? t('errAuth') : t('errNet')) + '</div>';
    })
    .then(function(){
      $('loginBtn').textContent = t('signin');
      $('loginBtn').disabled = false;
    });
}

function doLogout(){
  api('logout', {}).catch(function(){});
  localStorage.removeItem('token');
  location.reload();
}

/* ========================== load ========================== */
function skeleton(){
  return '<div class="card"><div class="skel" style="height:14px;width:44%;margin-bottom:16px"></div>' +
    '<div class="skel" style="height:52px;margin-bottom:12px"></div>' +
    '<div class="skel" style="height:52px;margin-bottom:12px"></div>' +
    '<div class="skel" style="height:52px"></div></div>' +
    '<div class="card"><div class="skel" style="height:118px;width:118px;border-radius:50%"></div></div>';
}
function load(){
  $('pageToday').innerHTML = skeleton();
  api('getDashboard', {})
    .then(function(d){ S.data = d; render(); })
    .catch(function(e){
      if (e.message === 'NO_SESSION' || e.message === 'SESSION_EXPIRED') {
        localStorage.removeItem('token'); location.reload(); return;
      }
      $('pageToday').innerHTML = '<div class="card"><div class="msg err">' + esc(t('errNet')) + '</div>' +
        '<button class="btn ghost" onclick="load()">' + esc(t('continueBtn')) + '</button></div>';
    });
}

function showTab(tab){
  S.tab = tab;
  ['today','board','me'].forEach(function(k){
    $('page' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== tab);
    $('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === tab);
  });
  window.scrollTo({ top:0, behavior:'smooth' });
  if (tab === 'board') loadBoard();
  if (tab === 'me') renderMe();
}

/* ========================== render: today ========================== */
function render(){
  var d = S.data;
  $('hName').textContent = d.user.name || d.user.username;
  $('hBiz').textContent = d.user.business_name || '';
  $('hCircle').textContent = d.user.circle_key || '';

  if (d.user.must_change_pw) return renderPasswordChange();
  if (!d.cycle) {
    $('pageToday').innerHTML = '<div class="card"><div class="empty"><span class="big">◷</span>' + esc(t('noCycle')) + '</div></div>';
    return;
  }

  var approved = d.targets.filter(function(x){ return x.status === 'APPROVED'; });
  if (!approved.length) return renderTargets();

  var html = '';
  html += renderTodayCard();
  html += renderScoreCard();
  html += renderProgress();
  $('pageToday').innerHTML = html;
  animateIn();
}

/* fills gauge + bars after paint so they animate from zero */
function animateIn(){
  requestAnimationFrame(function(){
    setTimeout(function(){
      var g = document.querySelector('.gauge .val');
      if (g) g.style.strokeDashoffset = g.dataset.offset;
      document.querySelectorAll('.bar i').forEach(function(el){ el.style.width = el.dataset.w + '%'; });
    }, 60);
  });
}

function inputMetrics(){
  return S.data.metrics.filter(function(m){ return m.type === 'INPUT'; });
}
function label(m){ return S.lang === 'ml' ? (m.label_ml || m.label_en) : m.label_en; }

function renderTodayCard(){
  var d = S.data, te = d.today_entry;
  var closedLeft = d.settings.closed_days_cap - (d.score ? d.score.closed_days : 0);
  var dateLine = prettyDate(d.cycle.today);

  if (te && te.is_closed) {
    return '<div class="card today-card done">' +
      '<h2>' + esc(t('todayNumbers')) + '</h2>' +
      '<p class="sub">' + esc(dateLine) + '</p>' +
      '<div class="tick">✓</div>' +
      '<div style="font-weight:600">' + esc(t('closedToday')) + '</div>' +
      '</div>';
  }

  var head = '<div class="card today-card' + (te ? ' done' : '') + '">' +
    '<h2>' + esc(t('todayNumbers')) + '</h2>' +
    '<p class="sub">' + esc(dateLine) + '</p>';

  if (te) {
    var summary = inputMetrics().map(function(m){
      return '<div class="done-row"><span>' + esc(label(m)) +
             '</span><b>' + fmt(te.payload[m.metric_key], m.unit) + '</b></div>';
    }).join('');
    return head +
      '<div class="tick">✓</div>' + summary +
      '<div class="btn-row"><button class="btn ghost" onclick="openEntry(false)">' + esc(t('edit')) + '</button>' +
      '<button class="btn ghost" onclick="openEntry(true)">' + esc(t('pickDate')) + '</button></div></div>';
  }

  var fields = inputMetrics().map(function(m){ return fieldHTML(m, 0); }).join('');

  return head + fields +
    '<button class="btn gold" id="saveBtn" onclick="submitToday()">' + esc(t('saveToday')) + '</button>' +
    '<div class="btn-row">' +
      '<button class="btn danger" onclick="markClosed()"' + (closedLeft <= 0 ? ' disabled' : '') + '>' +
        esc(t('shopClosed')) + ' · ' + esc(t('closedLeft', { n: Math.max(0, closedLeft) })) +
      '</button>' +
      '<button class="btn ghost" onclick="openEntry(true)">' + esc(t('pickDate')) + '</button>' +
    '</div>' +
    '</div>';
}

function fieldHTML(m, value){
  var cur = m.unit === 'CURRENCY';
  return '<div class="field"><label for="in_' + m.metric_key + '">' + esc(label(m)) + '</label>' +
    '<div class="inputbox' + (cur ? ' has-pre' : '') + '">' +
      (cur ? '<span class="pre">₹</span>' : '') +
      '<input id="in_' + m.metric_key + '" type="number" inputmode="decimal" min="0" step="any" value="' +
      (value || 0) + '" onfocus="this.select()">' +
    '</div></div>';
}

function renderScoreCard(){
  var d = S.data, s = d.score;
  if (!s) return '';
  var pts = Math.round(s.total_points);
  var C = 2 * Math.PI * 52;
  var off = C * (1 - Math.min(100, Math.max(0, pts)) / 100);

  var rankBits = '';
  if (s.circle_rank) rankBits += '<span class="pill rank"><b>#' + s.circle_rank + '</b> ' + esc(t('rankCircle')) + '</span>';
  if (s.overall_rank) rankBits += '<span class="pill"><b>#' + s.overall_rank + '</b> ' + esc(t('rankOverall')) + '</span>';
  if (s.penalty_points > 0) rankBits += '<span class="pill bad"><b>−' + s.penalty_points + '</b> ' + esc(t('penalty')) + '</span>';
  if (!rankBits) rankBits = '<span class="pill good"><b>' + s.entered_days + '</b> ' + esc(t('enteredDays')) + '</span>';

  return '<div class="card">' +
    '<h2>' + esc(t('points')) + '</h2>' +
    '<div class="scorewrap">' +
      '<div class="gauge">' +
        '<svg viewBox="0 0 118 118">' +
          '<circle class="trk" cx="59" cy="59" r="52"></circle>' +
          '<circle class="val" cx="59" cy="59" r="52" stroke-dasharray="' + C.toFixed(1) +
            '" stroke-dashoffset="' + C.toFixed(1) + '" data-offset="' + off.toFixed(1) + '"></circle>' +
        '</svg>' +
        '<div class="mid"><span class="num">' + pts + '</span><span class="of">' + esc(t('ofHundred')) + '</span></div>' +
      '</div>' +
      '<div class="scoreside">' + rankBits + '</div>' +
    '</div>' +
    renderLedger() +
    '</div>';
}

/* --- SIGNATURE ELEMENT: the month strip -------------------------------- */
function renderLedger(){
  var d = S.data;
  var start = d.cycle.start, end = d.cycle.end, today = d.cycle.today;
  var byDate = {};
  d.entries.forEach(function(e){ byDate[e.date] = e; });

  var cells = '', done = 0, total = 0, i = 0;
  var cursor = new Date(start + 'T00:00:00');
  var last = new Date(end + 'T00:00:00');
  var joinKey = d.user.join_date || start;

  while (cursor <= last) {
    var key = cursor.toISOString().slice(0, 10);
    var dayNum = cursor.getDate();
    var cls = 'day';
    if (key > today) cls += ' future';
    else if (key < joinKey) cls += ' future';
    else {
      total++;
      var e = byDate[key];
      if (e && e.is_closed) cls += ' closed';
      else if (e && e.is_backfill) { cls += ' late'; done++; }
      else if (e) { cls += ' filled'; done++; }
      else cls += ' missed';
    }
    if (key === today) cls += ' today';
    cells += '<div class="' + cls + '" style="animation-delay:' + (i * 12) + 'ms" title="' + key + '">' + dayNum + '</div>';
    i++;
    cursor.setDate(cursor.getDate() + 1);
  }

  return '<div class="ledger">' +
    '<div class="ledger-head"><b>' + esc(t('ledger')) + '</b>' +
      '<span>' + esc(t('ledgerDone', { a: done, b: total })) + '</span></div>' +
    '<div class="days">' + cells + '</div>' +
    '<div class="legend">' +
      '<span><i style="background:var(--ink)"></i>' + esc(t('lgDone')) + '</span>' +
      '<span><i style="background:#fff;border:1.5px solid var(--gold)"></i>' + esc(t('lgLate')) + '</span>' +
      '<span><i style="background:#fff;border:1.5px dashed var(--clay)"></i>' + esc(t('lgMissed')) + '</span>' +
      '<span><i style="background:var(--line)"></i>' + esc(t('lgClosed')) + '</span>' +
    '</div></div>';
}

function renderProgress(){
  var d = S.data;
  if (!d.score || !d.score.detail || !d.score.detail.metrics) return '';
  var rows = d.score.detail.metrics.filter(function(m){ return m.scored || m.type !== 'SYSTEM'; });

  var html = '<div class="card"><h2>' + esc(t('progress')) + '</h2>';
  rows.forEach(function(m){
    var pct = Math.min(100, m.achievement);
    var color = m.achievement >= 100 ? 'var(--jade)' : (m.achievement >= 70 ? 'var(--gold)' : 'var(--clay)');
    var name = S.lang === 'ml' ? (m.label_ml || m.label_en) : m.label_en;
    html += '<div class="metric">' +
      '<div class="metric-top"><span class="metric-name">' + esc(name) +
        (m.scored ? '<em>' + m.weight + '%</em>' : '') + '</span>' +
        '<span class="metric-pct" style="color:' + color + '">' + Math.round(m.achievement) + '%</span></div>' +
      '<div class="bar"><i data-w="' + pct + '" style="background:' + color + '"></i></div>' +
      '<div class="metric-foot"><span>' + esc(t('sofar')) + ' <b style="color:var(--ink)">' + fmt(m.actual, m.unit) + '</b></span>' +
        '<span>' + esc(t('tillToday')) + ' ' + fmt(m.pro_rated_target, m.unit) + '</span></div>' +
      '</div>';
  });
  return html + '</div>';
}

/* ========================== entry actions ========================== */
function collectValues(){
  var v = {};
  inputMetrics().forEach(function(m){
    var el = $('in_' + m.metric_key);
    v[m.metric_key] = el ? (Number(el.value) || 0) : 0;
  });
  return v;
}

function submitToday(date){
  if (S.busy) return;
  S.busy = true;
  var btn = $('saveBtn');
  if (btn) { btn.textContent = t('saving'); btn.disabled = true; }
  api('submitEntry', { date: date || S.data.cycle.today, values: collectValues() })
    .then(function(){ S.busy = false; toast(t('savedToast'), 'ok'); load(); })
    .catch(function(e){
      S.busy = false;
      if (btn) { btn.textContent = t('saveToday'); btn.disabled = false; }
      toast(friendly(e.message), 'err');
    });
}

function markClosed(){
  var cap = S.data.settings.closed_days_cap;
  sheet(t('closedTitle'), t('closedConfirm', { n: cap }), t('yes'), function(){
    api('submitEntry', { date: S.data.cycle.today, is_closed: true })
      .then(function(){ toast(t('closedToday'), 'ok'); load(); })
      .catch(function(e){ toast(friendly(e.message), 'err'); });
  });
}

function openEntry(withDate, forDate){
  var d = S.data;
  var date = forDate || d.cycle.today;
  if (withDate && !forDate) {
    $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('pickDate')) + '</h2>' +
      '<p class="sub">' + esc(d.cycle.start) + ' → ' + esc(d.cycle.today) + '</p>' +
      '<div class="field"><input id="pickDate" type="date" value="' + d.cycle.today +
        '" min="' + d.cycle.start + '" max="' + d.cycle.today + '"></div>' +
      '<button class="btn gold" onclick="openEntry(true, document.getElementById(\'pickDate\').value)">' + esc(t('continueBtn')) + '</button>' +
      '<div class="btn-row"><button class="btn ghost" onclick="render()">' + esc(t('close')) + '</button></div></div>';
    return;
  }
  var te = (d.entries.filter(function(e){ return e.date === date; })[0] || {}).payload || {};
  var fields = inputMetrics().map(function(m){ return fieldHTML(m, te[m.metric_key] || 0); }).join('');
  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('todayNumbers')) + '</h2>' +
    '<p class="sub">' + esc(prettyDate(date)) + '</p>' +
    (date !== d.cycle.today ? '<div class="msg warn"><span>⚠</span><span>' + esc(t('backfillWarn')) + '</span></div>' : '') +
    fields +
    '<button class="btn gold" id="saveBtn" onclick="submitToday(\'' + date + '\')">' + esc(t('saveToday')) + '</button>' +
    '<div class="btn-row"><button class="btn ghost" onclick="render()">' + esc(t('close')) + '</button></div></div>';
}

/* ========================== targets ========================== */
function renderTargets(){
  var d = S.data;
  var pending = d.targets.filter(function(x){ return x.status === 'PROPOSED'; });
  var rejected = d.targets.filter(function(x){ return x.status === 'REJECTED'; });

  if (pending.length) {
    $('pageToday').innerHTML = '<div class="card"><h2>' + esc(t('setTargets')) + '</h2>' +
      '<div class="msg warn"><span>◷</span><span>' + esc(t('targetsPending')) + '</span></div>' +
      pending.map(function(x){
        var m = metricByKey(x.metric_key);
        return '<div class="done-row"><span>' + esc(m ? label(m) : x.metric_key) +
               '</span><b>' + fmt(x.target_value, m ? m.unit : '') + '</b></div>';
      }).join('') + '</div>';
    return;
  }

  var fields = d.metrics.filter(function(m){ return m.has_target; }).map(function(m){
    var cur = m.unit === 'CURRENCY';
    return '<div class="field"><label for="tg_' + m.metric_key + '">' + esc(label(m)) + '</label>' +
      '<div class="inputbox' + (cur ? ' has-pre' : '') + '">' + (cur ? '<span class="pre">₹</span>' : '') +
      '<input id="tg_' + m.metric_key + '" type="number" inputmode="decimal" min="0" step="any" ' +
      'placeholder="0" onfocus="this.select()"></div></div>';
  }).join('');

  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('setTargets')) + '</h2>' +
    '<p class="sub">' + esc(t('setTargetsSub')) + '</p>' +
    (rejected.length ? '<div class="msg err"><span>✕</span><span>' + esc(t('targetsRejected')) + '</span></div>' : '') +
    fields +
    '<button class="btn gold" id="tgBtn" onclick="submitTargets()">' + esc(t('submitTargets')) + '</button></div>';
}

function submitTargets(){
  var targets = {};
  S.data.metrics.filter(function(m){ return m.has_target; }).forEach(function(m){
    targets[m.metric_key] = Number($('tg_' + m.metric_key).value) || 0;
  });
  $('tgBtn').disabled = true;
  api('proposeTargets', { targets: targets })
    .then(function(){ toast(t('targetsPending'), 'ok'); load(); })
    .catch(function(e){ $('tgBtn').disabled = false; toast(friendly(e.message), 'err'); });
}

/* ========================== leaderboard ========================== */
function loadBoard(){
  $('pageBoard').innerHTML = '<div class="card"><div class="skel" style="height:96px"></div></div>' +
    '<div class="card"><div class="skel" style="height:46px;margin-bottom:10px"></div>' +
    '<div class="skel" style="height:46px;margin-bottom:10px"></div><div class="skel" style="height:46px"></div></div>';
  api('getLeaderboard', {})
    .then(function(d){ S.board = d; renderBoard(); })
    .catch(function(){ $('pageBoard').innerHTML = '<div class="card"><div class="empty"><span class="big">⚡</span>' + esc(t('errNet')) + '</div></div>'; });
}

function renderBoard(){
  var b = S.board;
  if (!b) return;
  var me = S.data ? S.data.user.user_id : null;
  var html = '';

  if (b.locked) {
    html += '<div class="card"><div class="empty"><span class="big">🔒</span>' + esc(t('locked', { n: b.unlock_day })) + '</div></div>';
    $('pageBoard').innerHTML = html;
    return;
  }

  if (b.champion) {
    html += '<div class="champion"><h2>' + esc(t('champion')) + '</h2>' +
      '<b>' + esc(b.champion.name) + '</b>' +
      '<span class="cspan">' + esc(b.champion.business_name) + ' · ' + esc(b.champion.circle_key) + '</span>' +
      '<div class="pts">' + Math.round(b.champion.total_points) + '<em>' + esc(t('points')) + '</em></div></div>';
  }

  b.circles.forEach(function(c){
    var name = S.lang === 'ml' ? (c.name_ml || c.name_en) : c.name_en;
    html += '<div class="card"><h2>' + esc(name) + '</h2>';
    if (!c.rows.length) { html += '<div class="empty">—</div></div>'; return; }
    c.rows.forEach(function(r, i){
      var rank = r.circle_rank || (i + 1);
      html += '<div class="lb-row r' + (rank <= 3 ? rank : 'x') + (r.user_id === me ? ' me' : '') + '">' +
        '<span class="lb-rank">' + rank + '</span>' +
        '<span class="lb-name"><b>' + esc(r.name) + '</b><span>' + esc(r.business_name) + '</span></span>' +
        '<span class="lb-pts">' + Math.round(r.total_points) + '</span></div>';
    });
    html += '</div>';
  });

  if (b.all_time && b.all_time.length) {
    html += '<div class="card"><h2>' + esc(t('allTime')) + '</h2>';
    b.all_time.slice(0, 10).forEach(function(r, i){
      var rank = i + 1;
      html += '<div class="lb-row r' + (rank <= 3 ? rank : 'x') + (r.user_id === me ? ' me' : '') + '">' +
        '<span class="lb-rank">' + rank + '</span>' +
        '<span class="lb-name"><b>' + esc(r.name) + '</b><span>' + esc(r.circle_key) +
          ' · ' + r.cycles + ' ' + esc(t('months')) + '</span></span>' +
        '<span class="lb-pts">' + Math.round(r.total_points) + '</span></div>';
    });
    html += '</div>';
  }

  $('pageBoard').innerHTML = html;
}

/* ========================== me / settings ========================== */
function renderMe(){
  var d = S.data;
  if (!d) return;
  var s = d.score;
  var stats = s ? '<div class="pointsbar" style="margin-top:12px">' +
    '<span class="pill good"><b>' + s.entered_days + '</b> ' + esc(t('enteredDays')) + '</span>' +
    '<span class="pill bad"><b>' + s.missed_days + '</b> ' + esc(t('missedDays')) + '</span>' +
    '<span class="pill"><b>' + s.closed_days + '/' + d.settings.closed_days_cap + '</b> ' + esc(t('lgClosed')) + '</span>' +
    '</div>' : '';

  $('pageMe').innerHTML =
    '<div class="card"><h2>' + esc(t('account')) + '</h2>' +
      '<div style="font-size:20px;font-weight:700;letter-spacing:-.01em">' + esc(d.user.name || d.user.username) + '</div>' +
      '<p class="sub" style="margin:2px 0 0">' + esc(d.user.business_name || '') + ' · ' + esc(d.user.circle_key) + '</p>' + stats + '</div>' +
    '<div class="card"><h2>' + esc(t('changePw')) + '</h2>' +
      '<div id="pwMsg"></div>' +
      '<div class="field"><label>' + esc(t('currentPw')) + '</label><div class="inputbox"><input id="pwOld" type="password" style="font-size:17px"></div></div>' +
      '<div class="field"><label>' + esc(t('newPw')) + '</label><div class="inputbox"><input id="pwNew" type="password" style="font-size:17px"></div></div>' +
      '<button class="btn" onclick="savePassword()">' + esc(t('savePw')) + '</button></div>' +
    '<div class="card"><h2>' + esc(t('language')) + '</h2>' +
      '<button class="btn ghost" onclick="toggleLang()">English / മലയാളം</button>' +
      '<div class="btn-row"><button class="btn danger" onclick="doLogout()">' + esc(t('logout')) + '</button></div></div>';
}

function renderPasswordChange(){
  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('changePw')) + '</h2>' +
    '<div class="msg warn"><span>🔑</span><span>' + esc(t('mustChange')) + '</span></div><div id="pwMsg"></div>' +
    '<div class="field"><label>' + esc(t('currentPw')) + '</label><div class="inputbox"><input id="pwOld" type="password" style="font-size:17px"></div></div>' +
    '<div class="field"><label>' + esc(t('newPw')) + '</label><div class="inputbox"><input id="pwNew" type="password" style="font-size:17px"></div></div>' +
    '<button class="btn gold" onclick="savePassword()">' + esc(t('savePw')) + '</button></div>';
}

function savePassword(){
  api('changePassword', { current_password: $('pwOld').value, new_password: $('pwNew').value })
    .then(function(){
      toast(t('saved'), 'ok');
      $('pwOld').value = ''; $('pwNew').value = '';
      load();
    })
    .catch(function(e){
      var m = $('pwMsg');
      if (m) m.innerHTML = '<div class="msg err"><span>✕</span><span>' + esc(friendly(e.message)) + '</span></div>';
      toast(friendly(e.message), 'err');
    });
}

/* ========================== helpers ========================== */
function metricByKey(key){
  return S.data.metrics.filter(function(m){ return m.metric_key === key; })[0];
}
function fmt(value, unit){
  var n = Number(value) || 0;
  if (unit === 'CURRENCY') {
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }
  if (unit === 'PERCENT') return Math.round(n) + '%';
  if (unit === 'RATIO') return n.toFixed(2);
  return n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}
function prettyDate(key){
  try{
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(S.lang === 'ml' ? 'ml-IN' : 'en-IN',
      { weekday:'long', day:'numeric', month:'long' });
  }catch(e){ return key; }
}
function friendly(code){
  var map = {
    AUTH_FAILED:'errAuth', CLOSED_DAYS_EXHAUSTED:'errClosedCap', TARGETS_LOCKED:'errLocked',
    CURRENT_PASSWORD_WRONG:'errPw', PASSWORD_TOO_SHORT:'errShort', NO_OPEN_CYCLE:'noCycle'
  };
  return map[code] ? t(map[code]) : (code || t('errNet'));
}

/* ========================== boot ========================== */
(function(){
  var saved = localStorage.getItem('lang');
  if (saved && LANGS.indexOf(saved) >= 0) S.lang = saved;
  document.body.dataset.lang = S.lang;
  document.documentElement.lang = S.lang;
  paintChrome();

  $('password').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

  var token = localStorage.getItem('token');
  if (token) {
    S.token = token;
    $('loginView').classList.add('hide');
    $('appView').classList.remove('hide');
    load();
  }
})();
</script>

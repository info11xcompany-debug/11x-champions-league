<style>
:root{
  --ink:#101C2E;          /* ledger ink — headers, numbers */
  --ink-soft:#2D3E55;
  --page:#EEF1F5;         /* cool slate page */
  --card:#FFFFFF;
  --line:#DBE2EA;
  --brass:#B07D22;        /* points, rank, championship */
  --brass-tint:#FBF3E2;
  --jade:#1B7A58;         /* on track */
  --jade-tint:#E8F4EF;
  --clay:#B23A22;         /* behind, missed */
  --clay-tint:#FBECE8;
  --muted:#6B7A8D;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,28,46,.06), 0 8px 24px rgba(16,28,46,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);color:var(--ink);
  font-family:'Anek Latin','Anek Malayalam',system-ui,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
body[data-lang="ml"]{font-family:'Anek Malayalam','Anek Latin',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 96px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.hide{display:none !important}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:14px 16px calc(14px + 6px);margin:0 -16px 16px;
  border-radius:0 0 20px 20px;
}
.top-row{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:13px;color:#9FB0C4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(176,125,34,.22);color:#E9C87A;padding:4px 9px;border-radius:99px;white-space:nowrap;
}
.langbtn{
  border:1px solid rgba(255,255,255,.28);border-radius:99px;
  padding:5px 12px;font-size:13px;font-weight:600;color:#fff;
}
.langbtn:active{background:rgba(255,255,255,.14)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

/* ---------- points headline ---------- */
.points{display:flex;align-items:flex-end;gap:14px;margin:2px 0 6px}
.points .big{
  font-size:60px;line-height:.86;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.points .unit{font-size:14px;font-weight:600;color:var(--muted);padding-bottom:8px}
.pointsbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{
  font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;
  background:var(--page);color:var(--ink-soft);font-variant-numeric:tabular-nums;
}
.pill.rank{background:var(--brass-tint);color:#7A5510}
.pill.bad{background:var(--clay-tint);color:var(--clay)}
.pill.good{background:var(--jade-tint);color:var(--jade)}

/* ---------- SIGNATURE: the month ledger strip ---------- */
.ledger{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ledger-head b{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ledger-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.day{
  position:relative;aspect-ratio:1;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--page);color:#A9B6C6;border:1px solid transparent;
}
.day.filled{background:var(--ink);color:#fff;border-color:var(--ink)}
.day.late{background:#fff;color:var(--brass);border-color:var(--brass)}
.day.closed{background:repeating-linear-gradient(135deg,#fff,#fff 3px,var(--line) 3px,var(--line) 5px);color:var(--muted);border-color:var(--line)}
.day.missed{background:#fff;border:1.5px dashed var(--clay);color:var(--clay)}
.day.future{opacity:.42}
.day.today{outline:2.5px solid var(--brass);outline-offset:1.5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- today entry ---------- */
.today-card{border:2px solid var(--brass);background:linear-gradient(180deg,var(--brass-tint),#fff 60%)}
.today-card.done{border-color:var(--jade);background:linear-gradient(180deg,var(--jade-tint),#fff 60%)}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--muted);font-size:13px}
.field input{
  width:100%;padding:14px 14px;border:1.5px solid var(--line);border-radius:11px;
  background:#fff;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.field input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(176,125,34,.16)}
.btn{
  display:block;width:100%;padding:15px;border-radius:12px;
  background:var(--ink);color:#fff;font-weight:700;font-size:17px;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);font-size:15px;font-weight:600}
.btn.danger{background:#fff;color:var(--clay);border:1.5px solid var(--clay);font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{margin:0}

/* ---------- metric progress ---------- */
.metric{padding:13px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none;padding-bottom:0}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.metric-name{font-weight:600;font-size:15px}
.metric-name em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;margin-left:5px}
.metric-pct{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--page);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.metric-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* ---------- leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-rank{
  width:30px;text-align:center;font-weight:800;font-size:17px;
  font-variant-numeric:tabular-nums;color:var(--muted);flex:none;
}
.lb-row.top .lb-rank{color:var(--brass)}
.lb-row.me{background:var(--brass-tint);margin:0 -18px;padding:12px 18px;border-radius:9px}
.lb-name{flex:1;min-width:0}
.lb-name b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pts{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.champion{
  background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.champion h2{color:#E9C87A;margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.champion b{display:block;font-size:22px;font-weight:700}
.champion span{color:#9FB0C4;font-size:14px}
.champion .pts{margin-top:10px;font-size:30px;font-weight:800;color:#E9C87A;font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.tabs button{flex:1;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);border-radius:10px}
.tabs button.on{color:var(--ink);background:var(--page)}
.tabs .dot{display:block;font-size:19px;line-height:1.1}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.login p{color:var(--muted);margin:0 0 26px}
.login input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:12px;font-size:16px;background:#fff}
.login input:focus{outline:none;border-color:var(--brass)}

/* ---------- misc ---------- */
.msg{padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500;margin-bottom:12px}
.msg.err{background:var(--clay-tint);color:var(--clay)}
.msg.ok{background:var(--jade-tint);color:var(--jade)}
.msg.warn{background:var(--brass-tint);color:#7A5510}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:15px}
.spinner{
  width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--ink);
  border-radius:50%;animation:spin .7s linear infinite;margin:36px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
</style>
</head>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ========================== api ========================== */
function api(action, payload){
  var body = Object.assign({ action:action, token:S.token }, payload || {});
  return fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body:JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if (!res.ok) throw new Error(res.error || 'ERROR');
    return res.data;
  });
}

/* ========================== language ========================== */
function toggleLang(){
  S.lang = LANGS[(LANGS.indexOf(S.lang)+1) % LANGS.length];
  document.body.dataset.lang = S.lang;
  document.documentElement.lang = S.lang;
  localStorage.setItem('lang', S.lang);
  paintChrome();
  if (S.token) { if (S.data) render(); if (S.tab==='board') renderBoard(); }
}
function paintChrome(){
  $('loginSub').textContent = t('tagline');
  $('loginBtn').textContent = t('signin');
  $('username').placeholder = 'Username';
  $('password').placeholder = 'Password';
  $('tabTodayLbl').textContent = t('today');
  $('tabBoardLbl').textContent = t('board');
  $('tabMeLbl').textContent = t('me');
  $('hLang').textContent = S.lang === 'ml' ? 'EN' : 'ML';
}

/* ========================== login ========================== */
function doLogin(){
  var u = $('username').value.trim(), p = $('password').value;
  if (!u || !p) return;
  $('loginBtn').textContent = t('signingin');
  $('loginBtn').disabled = true;
  api('login', { username:u, password:p })
    .then(function(d){
      S.token = d.token;
      localStorage.setItem('token', d.token);
      if (d.user.lang) { S.lang = d.user.lang; document.body.dataset.lang = S.lang; }
      $('loginView').classList.add('hide');
      $('appView').classList.remove('hide');
      paintChrome();
      load();
    })
    .catch(function(e){
      $('loginMsg').innerHTML = '<div class="msg err">' +
        esc(e.message === 'AUTH_FAILED' ? t('errAuth') : t('errNet')) + '</div>';
    })
    .then(function(){
      $('loginBtn').textContent = t('signin');
      $('loginBtn').disabled = false;
    });
}

function doLogout(){
  api('logout', {}).catch(function(){});
  localStorage.removeItem('token');
  location.reload();
}

/* ========================== load ========================== */
function load(){
  $('pageToday').innerHTML = '<div class="spinner"></div>';
  api('getDashboard', {})
    .then(function(d){ S.data = d; render(); })
    .catch(function(e){
      if (e.message === 'NO_SESSION' || e.message === 'SESSION_EXPIRED') {
        localStorage.removeItem('token'); location.reload(); return;
      }
      $('pageToday').innerHTML = '<div class="card"><div class="msg err">' + esc(t('errNet')) + '</div></div>';
    });
}

function showTab(tab){
  S.tab = tab;
  ['today','board','me'].forEach(function(k){
    $('page' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== tab);
    $('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === tab);
  });
  if (tab === 'board') loadBoard();
  if (tab === 'me') renderMe();
}

/* ========================== render: today ========================== */
function render(){
  var d = S.data;
  $('hName').textContent = d.user.name || d.user.username;
  $('hBiz').textContent = d.user.business_name || '';
  $('hCircle').textContent = d.user.circle_key || '';

  if (d.user.must_change_pw) return renderPasswordChange();
  if (!d.cycle) {
    $('pageToday').innerHTML = '<div class="card"><div class="empty">' + esc(t('noCycle')) + '</div></div>';
    return;
  }

  var approved = d.targets.filter(function(x){ return x.status === 'APPROVED'; });
  if (!approved.length) return renderTargets();

  var html = '';
  html += renderTodayCard();
  html += renderScoreCard();
  html += renderProgress();
  $('pageToday').innerHTML = html;
}

function inputMetrics(){
  return S.data.metrics.filter(function(m){ return m.type === 'INPUT'; });
}
function label(m){ return S.lang === 'ml' ? (m.label_ml || m.label_en) : m.label_en; }

function renderTodayCard(){
  var d = S.data, te = d.today_entry;
  var closedLeft = d.settings.closed_days_cap - (d.score ? d.score.closed_days : 0);

  if (te && te.is_closed) {
    return '<div class="card today-card done">' +
      '<h2>' + esc(t('todayNumbers')) + '</h2>' +
      '<div class="msg ok" style="margin:0">' + esc(t('closedToday')) + '</div>' +
      '</div>';
  }

  var head = '<div class="card today-card' + (te ? ' done' : '') + '">' +
    '<h2>' + esc(t('todayNumbers')) + '</h2>' +
    '<p class="sub">' + esc(d.cycle.today) + '</p>';

  if (te) {
    var summary = inputMetrics().map(function(m){
      return '<div class="metric-foot" style="margin:0 0 6px"><span>' + esc(label(m)) +
             '</span><b style="color:var(--ink)">' + fmt(te.payload[m.metric_key], m.unit) + '</b></div>';
    }).join('');
    return head + summary +
      '<div class="btn-row"><button class="btn ghost" onclick="openEntry(false)">' + esc(t('edit')) + '</button></div></div>';
  }

  var fields = inputMetrics().map(function(m){
    return '<div class="field"><label for="in_' + m.metric_key + '">' + esc(label(m)) + '</label>' +
      '<input id="in_' + m.metric_key + '" type="number" inputmode="decimal" min="0" step="any" value="0" ' +
      'onfocus="this.select()"></div>';
  }).join('');

  return head + fields +
    '<button class="btn" id="saveBtn" onclick="submitToday()">' + esc(t('saveToday')) + '</button>' +
    '<div class="btn-row">' +
      '<button class="btn danger" onclick="markClosed()"' + (closedLeft <= 0 ? ' disabled' : '') + '>' +
        esc(t('shopClosed')) + ' · ' + esc(t('closedLeft', { n: Math.max(0, closedLeft) })) +
      '</button>' +
    '</div>' +
    '<div class="btn-row"><button class="btn ghost" onclick="openEntry(true)">' + esc(t('pickDate')) + '</button></div>' +
    '</div>';
}

function renderScoreCard(){
  var d = S.data, s = d.score;
  if (!s) return '';
  var rankBits = '';
  if (s.circle_rank) {
    rankBits += '<span class="pill rank">#' + s.circle_rank + ' ' + esc(t('rankCircle')) + '</span>';
  }
  if (s.overall_rank) {
    rankBits += '<span class="pill">#' + s.overall_rank + ' ' + esc(t('rankOverall')) + '</span>';
  }
  if (s.penalty_points > 0) {
    rankBits += '<span class="pill bad">−' + s.penalty_points + ' ' + esc(t('penalty')) + '</span>';
  }

  return '<div class="card">' +
    '<h2>' + esc(t('points')) + '</h2>' +
    '<div class="points"><span class="big">' + Math.round(s.total_points) + '</span>' +
      '<span class="unit">' + esc(t('ofHundred')) + '</span></div>' +
    '<div class="pointsbar">' + rankBits + '</div>' +
    renderLedger() +
    '</div>';
}

/* --- SIGNATURE ELEMENT: the month strip -------------------------------- */
function renderLedger(){
  var d = S.data;
  var start = d.cycle.start, end = d.cycle.end, today = d.cycle.today;
  var byDate = {};
  d.entries.forEach(function(e){ byDate[e.date] = e; });

  var cells = '', done = 0, total = 0;
  var cursor = new Date(start + 'T00:00:00');
  var last = new Date(end + 'T00:00:00');
  var joinKey = d.user.join_date || start;

  while (cursor <= last) {
    var key = cursor.toISOString().slice(0, 10);
    var dayNum = cursor.getDate();
    var cls = 'day';
    if (key > today) cls += ' future';
    else if (key < joinKey) cls += ' future';
    else {
      total++;
      var e = byDate[key];
      if (e && e.is_closed) cls += ' closed';
      else if (e && e.is_backfill) { cls += ' late'; done++; }
      else if (e) { cls += ' filled'; done++; }
      else cls += ' missed';
    }
    if (key === today) cls += ' today';
    cells += '<div class="' + cls + '" title="' + key + '">' + dayNum + '</div>';
    cursor.setDate(cursor.getDate() + 1);
  }

  return '<div class="ledger">' +
    '<div class="ledger-head"><b>' + esc(t('ledger')) + '</b>' +
      '<span>' + esc(t('ledgerDone', { a: done, b: total })) + '</span></div>' +
    '<div class="days">' + cells + '</div>' +
    '<div class="legend">' +
      '<span><i style="background:var(--ink)"></i>' + esc(t('lgDone')) + '</span>' +
      '<span><i style="background:#fff;border:1.5px solid var(--brass)"></i>' + esc(t('lgLate')) + '</span>' +
      '<span><i style="background:#fff;border:1.5px dashed var(--clay)"></i>' + esc(t('lgMissed')) + '</span>' +
      '<span><i style="background:var(--line)"></i>' + esc(t('lgClosed')) + '</span>' +
    '</div></div>';
}

function renderProgress(){
  var d = S.data;
  if (!d.score || !d.score.detail || !d.score.detail.metrics) return '';
  var rows = d.score.detail.metrics.filter(function(m){ return m.scored || m.type !== 'SYSTEM'; });

  var html = '<div class="card"><h2>' + esc(t('progress')) + '</h2>';
  rows.forEach(function(m){
    var pct = Math.min(100, m.achievement);
    var color = m.achievement >= 100 ? 'var(--jade)' : (m.achievement >= 70 ? 'var(--brass)' : 'var(--clay)');
    var name = S.lang === 'ml' ? (m.label_ml || m.label_en) : m.label_en;
    html += '<div class="metric">' +
      '<div class="metric-top"><span class="metric-name">' + esc(name) +
        (m.scored ? '<em>' + m.weight + '%</em>' : '') + '</span>' +
        '<span class="metric-pct" style="color:' + color + '">' + Math.round(m.achievement) + '%</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%;background:' + color + '"></i></div>' +
      '<div class="metric-foot"><span>' + esc(t('sofar')) + ' ' + fmt(m.actual, m.unit) + '</span>' +
        '<span>' + esc(t('tillToday')) + ' ' + fmt(m.pro_rated_target, m.unit) + '</span></div>' +
      '</div>';
  });
  return html + '</div>';
}

/* ========================== entry actions ========================== */
function collectValues(){
  var v = {};
  inputMetrics().forEach(function(m){
    var el = $('in_' + m.metric_key);
    v[m.metric_key] = el ? (Number(el.value) || 0) : 0;
  });
  return v;
}

function submitToday(date){
  if (S.busy) return;
  S.busy = true;
  var btn = $('saveBtn');
  if (btn) { btn.textContent = t('saving'); btn.disabled = true; }
  api('submitEntry', { date: date || S.data.cycle.today, values: collectValues() })
    .then(function(){ S.busy = false; load(); })
    .catch(function(e){
      S.busy = false;
      if (btn) { btn.textContent = t('saveToday'); btn.disabled = false; }
      alert(friendly(e.message));
    });
}

function markClosed(){
  var cap = S.data.settings.closed_days_cap;
  if (!confirm(t('closedConfirm', { n: cap }))) return;
  api('submitEntry', { date: S.data.cycle.today, is_closed: true })
    .then(load)
    .catch(function(e){ alert(friendly(e.message)); });
}

function openEntry(withDate, forDate){
  var d = S.data;
  var date = forDate || d.cycle.today;
  if (withDate && !forDate) {
    $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('pickDate')) + '</h2>' +
      '<div class="field"><input id="pickDate" type="date" value="' + d.cycle.today +
        '" min="' + d.cycle.start + '" max="' + d.cycle.today + '"></div>' +
      '<button class="btn" onclick="openEntry(true, document.getElementById(\'pickDate\').value)">→</button>' +
      '<div class="btn-row"><button class="btn ghost" onclick="render()">✕</button></div></div>';
    return;
  }
  var te = (d.entries.filter(function(e){ return e.date === date; })[0] || {}).payload || {};
  var fields = inputMetrics().map(function(m){
    return '<div class="field"><label>' + esc(label(m)) + '</label>' +
      '<input id="in_' + m.metric_key + '" type="number" inputmode="decimal" min="0" step="any" value="' +
      (te[m.metric_key] || 0) + '" onfocus="this.select()"></div>';
  }).join('');
  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('todayNumbers')) + '</h2>' +
    '<p class="sub">' + esc(date) + '</p>' +
    (date !== d.cycle.today ? '<div class="msg warn">' + esc(t('backfillWarn')) + '</div>' : '') +
    fields +
    '<button class="btn" id="saveBtn" onclick="submitToday(\'' + date + '\')">' + esc(t('saveToday')) + '</button>' +
    '<div class="btn-row"><button class="btn ghost" onclick="render()">✕</button></div></div>';
}

/* ========================== targets ========================== */
function renderTargets(){
  var d = S.data;
  var pending = d.targets.filter(function(x){ return x.status === 'PROPOSED'; });
  var rejected = d.targets.filter(function(x){ return x.status === 'REJECTED'; });

  if (pending.length) {
    $('pageToday').innerHTML = '<div class="card"><h2>' + esc(t('setTargets')) + '</h2>' +
      '<div class="msg warn">' + esc(t('targetsPending')) + '</div>' +
      pending.map(function(x){
        var m = metricByKey(x.metric_key);
        return '<div class="metric-foot" style="margin-bottom:8px"><span>' + esc(m ? label(m) : x.metric_key) +
               '</span><b style="color:var(--ink)">' + fmt(x.target_value, m ? m.unit : '') + '</b></div>';
      }).join('') + '</div>';
    return;
  }

  var fields = d.metrics.filter(function(m){ return m.has_target; }).map(function(m){
    return '<div class="field"><label for="tg_' + m.metric_key + '">' + esc(label(m)) + '</label>' +
      '<input id="tg_' + m.metric_key + '" type="number" inputmode="decimal" min="0" step="any" ' +
      'placeholder="0" onfocus="this.select()"></div>';
  }).join('');

  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('setTargets')) + '</h2>' +
    '<p class="sub">' + esc(t('setTargetsSub')) + '</p>' +
    (rejected.length ? '<div class="msg err">' + esc(t('targetsRejected')) + '</div>' : '') +
    fields +
    '<button class="btn" id="tgBtn" onclick="submitTargets()">' + esc(t('submitTargets')) + '</button></div>';
}

function submitTargets(){
  var targets = {};
  S.data.metrics.filter(function(m){ return m.has_target; }).forEach(function(m){
    targets[m.metric_key] = Number($('tg_' + m.metric_key).value) || 0;
  });
  $('tgBtn').disabled = true;
  api('proposeTargets', { targets: targets })
    .then(load)
    .catch(function(e){ $('tgBtn').disabled = false; alert(friendly(e.message)); });
}

/* ========================== leaderboard ========================== */
function loadBoard(){
  $('pageBoard').innerHTML = '<div class="spinner"></div>';
  api('getLeaderboard', {})
    .then(function(d){ S.board = d; renderBoard(); })
    .catch(function(){ $('pageBoard').innerHTML = '<div class="card"><div class="empty">' + esc(t('errNet')) + '</div></div>'; });
}

function renderBoard(){
  var b = S.board;
  if (!b) return;
  var me = S.data ? S.data.user.user_id : null;
  var html = '';

  if (b.locked) {
    html += '<div class="card"><div class="empty">' + esc(t('locked', { n: b.unlock_day })) + '</div></div>';
    $('pageBoard').innerHTML = html;
    return;
  }

  if (b.champion) {
    html += '<div class="champion"><h2>' + esc(t('champion')) + '</h2>' +
      '<b>' + esc(b.champion.name) + '</b>' +
      '<span>' + esc(b.champion.business_name) + ' · ' + esc(b.champion.circle_key) + '</span>' +
      '<div class="pts">' + Math.round(b.champion.total_points) + '</div></div>';
  }

  b.circles.forEach(function(c){
    var name = S.lang === 'ml' ? (c.name_ml || c.name_en) : c.name_en;
    html += '<div class="card"><h2>' + esc(name) + '</h2>';
    if (!c.rows.length) { html += '<div class="empty">—</div></div>'; return; }
    c.rows.forEach(function(r, i){
      html += '<div class="lb-row' + (i === 0 ? ' top' : '') + (r.user_id === me ? ' me' : '') + '">' +
        '<span class="lb-rank">' + (r.circle_rank || (i + 1)) + '</span>' +
        '<span class="lb-name"><b>' + esc(r.name) + '</b><span>' + esc(r.business_name) + '</span></span>' +
        '<span class="lb-pts">' + Math.round(r.total_points) + '</span></div>';
    });
    html += '</div>';
  });

  if (b.all_time && b.all_time.length) {
    html += '<div class="card"><h2>' + esc(t('allTime')) + '</h2>';
    b.all_time.slice(0, 10).forEach(function(r, i){
      html += '<div class="lb-row' + (i === 0 ? ' top' : '') + (r.user_id === me ? ' me' : '') + '">' +
        '<span class="lb-rank">' + (i + 1) + '</span>' +
        '<span class="lb-name"><b>' + esc(r.name) + '</b><span>' + esc(r.circle_key) +
          ' · ' + r.cycles + ' ' + esc(t('months')) + '</span></span>' +
        '<span class="lb-pts">' + Math.round(r.total_points) + '</span></div>';
    });
    html += '</div>';
  }

  $('pageBoard').innerHTML = html;
}

/* ========================== me / settings ========================== */
function renderMe(){
  var d = S.data;
  if (!d) return;
  var s = d.score;
  var stats = s ? '<div class="pointsbar" style="margin-top:0">' +
    '<span class="pill good">' + s.entered_days + ' ' + esc(t('enteredDays')) + '</span>' +
    '<span class="pill bad">' + s.missed_days + ' ' + esc(t('missedDays')) + '</span>' +
    '<span class="pill">' + s.closed_days + '/' + d.settings.closed_days_cap + ' ' + esc(t('lgClosed')) + '</span>' +
    '</div>' : '';

  $('pageMe').innerHTML =
    '<div class="card"><h2>' + esc(d.user.username) + '</h2>' +
      '<p class="sub">' + esc(d.user.business_name || '') + ' · ' + esc(d.user.circle_key) + '</p>' + stats + '</div>' +
    '<div class="card"><h2>' + esc(t('changePw')) + '</h2>' +
      '<div id="pwMsg"></div>' +
      '<div class="field"><label>' + esc(t('currentPw')) + '</label><input id="pwOld" type="password"></div>' +
      '<div class="field"><label>' + esc(t('newPw')) + '</label><input id="pwNew" type="password"></div>' +
      '<button class="btn" onclick="savePassword()">' + esc(t('savePw')) + '</button></div>' +
    '<div class="card"><button class="btn ghost" onclick="toggleLang()">English / മലയാളം</button>' +
      '<div class="btn-row"><button class="btn danger" onclick="doLogout()">' + esc(t('logout')) + '</button></div></div>';
}

function renderPasswordChange(){
  $('pageToday').innerHTML = '<div class="card today-card"><h2>' + esc(t('changePw')) + '</h2>' +
    '<div class="msg warn">' + esc(t('mustChange')) + '</div><div id="pwMsg"></div>' +
    '<div class="field"><label>' + esc(t('currentPw')) + '</label><input id="pwOld" type="password"></div>' +
    '<div class="field"><label>' + esc(t('newPw')) + '</label><input id="pwNew" type="password"></div>' +
    '<button class="btn" onclick="savePassword()">' + esc(t('savePw')) + '</button></div>';
}

function savePassword(){
  api('changePassword', { current_password: $('pwOld').value, new_password: $('pwNew').value })
    .then(function(){
      $('pwMsg').innerHTML = '<div class="msg ok">' + esc(t('saved')) + '</div>';
      $('pwOld').value = ''; $('pwNew').value = '';
      load();
    })
    .catch(function(e){
      $('pwMsg').innerHTML = '<div class="msg err">' + esc(friendly(e.message)) + '</div>';
    });
}

/* ========================== helpers ========================== */
function metricByKey(key){
  return S.data.metrics.filter(function(m){ return m.metric_key === key; })[0];
}
function fmt(value, unit){
  var n = Number(value) || 0;
  if (unit === 'CURRENCY') {
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }
  if (unit === 'PERCENT') return Math.round(n) + '%';
  if (unit === 'RATIO') return n.toFixed(2);
  return n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}
function friendly(code){
  var map = {
    AUTH_FAILED:'errAuth', CLOSED_DAYS_EXHAUSTED:'errClosedCap', TARGETS_LOCKED:'errLocked',
    CURRENT_PASSWORD_WRONG:'errPw', PASSWORD_TOO_SHORT:'errShort', NO_OPEN_CYCLE:'noCycle'
  };
  return map[code] ? t(map[code]) : (code || t('errNet'));
}

/* ========================== boot ========================== */
(function(){
  var saved = localStorage.getItem('lang');
  if (saved && LANGS.indexOf(saved) >= 0) S.lang = saved;
  document.body.dataset.lang = S.lang;
  document.documentElement.lang = S.lang;
  paintChrome();

  $('password').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

  var token = localStorage.getItem('token');
  if (token) {
    S.token = token;
    $('loginView').classList.add('hide');
    $('appView').classList.remove('hide');
    load();
  }
})();
</script>
